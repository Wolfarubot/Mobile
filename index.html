<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14101f" />
    <title>Monster Horde Idle</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="stat gold"><span>🪙</span><b id="gold">0</b></div>
        <div class="stage">
          <div id="areaNum">Area 1 of 5</div>
          <b id="areaName">Whispering Forest</b>
        </div>
        <div class="stat dps"><b id="dps">0</b><small>DPS</small></div>
      </header>
      <div class="battle-wrap"><canvas id="battle"></canvas></div>
      <div class="progress">
        <button id="prevArea" class="nav-btn" aria-label="Previous area">◀</button>
        <div class="kills"><div class="kills-fill" id="killsFill"></div><span id="killsText"></span></div>
        <button id="nextArea" class="nav-btn" aria-label="Next area">▶</button>
        <button id="challengeBtn" class="challenge-btn hidden">⚔️ Guardian</button>
      </div>
      <div id="frenzy" class="frenzy hidden">🔥 FRENZY ×2 damage · <span id="frenzyTime"></span></div>
      <nav class="tabs">
        <button data-tab="hunters" class="active"><i>🏹</i>Hunters <span class="badge dot hidden" id="huntersBadge"></span></button>
        <button data-tab="areas"><i>🗺️</i>Areas</button>
        <button data-tab="beasts"><i>👾</i>Bestiary <span class="badge dot hidden" id="beastBadge"></span></button>
        <button data-tab="forge"><i>🔨</i>Forge <span class="badge dot hidden" id="forgeBadge"></span></button>
        <button data-tab="arena"><i>🎮</i>Arena <span class="badge hidden" id="ticketBadge"></span></button>
      </nav>
      <main class="panel" id="panel"></main>
    </div>
    <div id="modal" class="modal hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
