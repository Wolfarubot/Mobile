<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14101f" />
    <title>Pocket Hunter</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="stat gold"><span>🪙</span><b id="gold">0</b></div>
        <div class="stage"><b id="areaName">Whispering Forest</b></div>
        <div class="stat dps"><b id="dps">0</b><small>DPS</small><button id="settingsBtn" class="settings-btn" aria-label="Settings">⚙️</button></div>
      </header>
      <div class="battle-wrap">
        <canvas id="battle"></canvas>
      </div>
      <nav class="tabs">
        <button data-tab="hunters" class="active"><i>🏹</i>Hunters <span class="badge dot hidden" id="huntersBadge"></span></button>
        <button data-tab="areas"><i>🗺️</i>Areas</button>
        <button data-tab="beasts"><i>👾</i>Bestiary <span class="badge dot hidden" id="beastBadge"></span></button>
        <button data-tab="equipment"><i>🛡️</i>Equipment <span class="badge dot hidden" id="forgeBadge"></span></button>
        <button data-tab="events"><i>🎉</i>Events <span class="badge hidden" id="eventsBadge"></span></button>
      </nav>
      <main class="panel" id="panel"></main>
    </div>
    <div id="modal" class="modal hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
