<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14101f" />
    <title>Monster Horde Idle</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="stat gold"><span>🪙</span><b id="gold">0</b></div>
        <div class="stage">
          <div id="zone">Mossy Glade</div>
          <b id="stageLabel">Stage 1</b>
        </div>
        <div class="stat dps"><b id="dps">0</b><small>DPS</small></div>
      </header>
      <div class="battle-wrap"><canvas id="battle"></canvas></div>
      <div class="progress">
        <button id="prevStage" class="nav-btn" aria-label="Previous stage">◀</button>
        <div class="kills"><div class="kills-fill" id="killsFill"></div><span id="killsText">0 / 40</span></div>
        <button id="nextStage" class="nav-btn" aria-label="Next stage">▶</button>
        <button id="autoBtn" class="auto-btn" aria-label="Toggle auto-advance">AUTO</button>
      </div>
      <div id="frenzy" class="frenzy hidden">🔥 FRENZY ×2 damage · <span id="frenzyTime"></span></div>
      <nav class="tabs">
        <button data-tab="upgrades" class="active"><i>⬆️</i>Train</button>
        <button data-tab="beasts"><i>👾</i>Bestiary <span class="badge dot hidden" id="beastBadge"></span></button>
        <button data-tab="forge"><i>🔨</i>Forge <span class="badge dot hidden" id="forgeBadge"></span></button>
        <button data-tab="arena"><i>🎮</i>Arena <span class="badge hidden" id="ticketBadge"></span></button>
        <button data-tab="souls"><i>🔮</i>Souls</button>
      </nav>
      <main class="panel" id="panel"></main>
    </div>
    <div id="modal" class="modal hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
