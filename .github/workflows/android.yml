name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Unit tests gate the build. The long pacing simulation runs after the APK is uploaded (below).
      - run: npx vitest run --exclude tests/progression.test.ts
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-hunter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Balance check: flags pacing drift (shown as a failed step) without holding back the APK.
      - name: Pacing simulation
        continue-on-error: true
        run: npx vitest run tests/progression.test.ts
