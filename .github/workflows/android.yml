name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # Unit tests gate the build. The long pacing simulation runs after the APK is uploaded (below).
      - run: npx vitest run --exclude tests/progression.test.ts
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The app's signing key (GitHub secrets), so every build has the same SHA-1 for Google sign-in. Builds without
      # the secrets (forks, or before they're added) fall back to a throwaway debug key.
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        if: env.ANDROID_KEYSTORE != ''
        run: echo "$ANDROID_KEYSTORE" | base64 -d > android/app/release.jks

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-hunter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Balance check: flags pacing drift (shown as a failed step) without holding back the APK.
      - name: Pacing simulation
        continue-on-error: true
        run: npx vitest run tests/progression.test.ts
