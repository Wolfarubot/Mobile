name: iOS

# Builds the iPhone app on a Mac runner.
# - Every push: compiles it for the iOS Simulator (no Apple account needed), so a change that breaks the iOS build
#   shows up straight away.
# - Run by hand (Actions -> iOS -> Run workflow) once the App Store Connect secrets are set: builds a signed copy
#   and uploads it to TestFlight, where it installs on iPhones. Signing is managed by Xcode with the App Store Connect
#   API key, so no certificate or provisioning profile is stored here.
#
# Secrets for TestFlight (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID          the 10-character Team ID (developer.apple.com -> Account -> Membership details)
#   ASC_KEY_ID             the App Store Connect API key's Key ID
#   ASC_ISSUER_ID          the Issuer ID shown above the API keys list
#   ASC_KEY_P8             the contents of the downloaded AuthKey_XXXXXXXXXX.p8 file

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for the iOS Simulator
        if: github.event_name != 'workflow_dispatch'
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -n 60;
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: App Store Connect key
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::The App Store Connect secrets (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) aren't all set yet."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      # Signed by Xcode (development signing needs at least one iPhone registered under Devices on
      # developer.apple.com); the upload step below re-signs it for the App Store with a distribution certificate
      # Xcode creates and keeps in the Apple account.
      - name: Archive (signed)
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/App.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          archive | tail -n 60;
          exit ${PIPESTATUS[0]}

      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: >
          xcodebuild -exportArchive -archivePath build/App.xcarchive
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          | tail -n 60;
          exit ${PIPESTATUS[0]}
