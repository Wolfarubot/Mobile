name: Web

# The web version for playtesting (iPhone testers play it in Safari, added to the Home Screen): every push to the
# development branch is built and published to the gh-pages branch, which GitHub Pages serves at
# https://wolfarubot.github.io/Mobile/. To take it down: Settings -> Pages -> unpublish (or set Source to None),
# delete the gh-pages branch, and delete this file.

on:
  push:
    branches: [claude/monster-incremental-game-s0u3gg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:release

      - name: Publish to the gh-pages branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web build of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
